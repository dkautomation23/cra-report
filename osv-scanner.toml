# The vulnerable components in fixtures/ are the demo input, not dependencies.
#
# `fixtures/sbom.cdx.json` deliberately names log4j-core 2.14.1, lodash 4.17.15
# and requests 2.31.0, and `fixtures/package-lock.json` an old lodash, because a
# report generator with nothing to report demonstrates nothing. A scanner that
# walks this repository reads those files as a bill of materials for the
# repository itself and concludes the project is vulnerable to fourteen
# advisories. Nothing cra-report ships depends on any of them: `npm audit
# --omit=dev` and `npm audit` both report zero.
#
# Listed with a reason rather than deleted: deleting the fixtures would remove
# the only worked example in the README.
